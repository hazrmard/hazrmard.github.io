baseurl = "https://iahmed.me/"
title = "Ibrahim Ahmed"
locale = "en-us"
theme = "hugolb"
copyright = "Ibrahim Ahmed"

# generate robots.txt (layouts/robots.txt) referencing the sitemap
enableRobotsTXT = true

# hugo build parameters
[pagination]
    pagerSize = 100
    paginatePath = "p"

ignoreFiles = [".+pptx$", ".venv"]

[security]
    allowContent = ["^text/html$", "text/markdown"]

[frontmatter]
  date = ["date", "publishDate", "lastmod"]
  # explicit front-matter "lastmod" wins if a post sets one; otherwise falls
  # back to "date". No longer derived from git history (see .github/workflows/hugo.yml).
  lastmod = ["lastmod", "date"]
# ====

[params]
# Site/Blog/theme specific parameters
# ====
    splashSubheading = ""
    blogroot = "Posts"
    keywords = "machine learning, artificial intelligence, reinforcement learning, research, computer science, engineering, technical expert"
    description = "Ibrahim Ahmed, PhD's personal blog on Machine learning, Artificial Intelligence (AI), Reinforcement Learning (RL), research, computer science, and engineering."
    twitter = "hazrmard"
    analyticsID = "G-6YPFGDNV4W"
    defaultprojimg = "/img/gear.png"
    defaultpostimg = "/img/quill.jpg"
    # used to build an obfuscated "get in touch" mailto link (see partials/contact-email.html)
    email = "ibrahim@iahmed.me"

    [[params.links]]
        name = "LinkedIn"
        URL = "https://www.linkedin.com/in/IbrahimAhmed1"
        image = "/img/LinkIcons/svg/linkedin.svg"

    [[params.links]]
        name = "GitHub"
        URL = "https://github.com/hazrmard"
        image = "/img/LinkIcons/svg/github.svg"

    [[params.links]]
        name = "Google Scholar"
        URL = "https://scholar.google.com/citations?user=_Nn9bWgAAAAJ&hl=en"
        image = "/img/LinkIcons/svg/google-scholar.svg"

    [[params.links]]
