# ====

# Other hugo configuration options
# ====
[taxonomies]
    tag = "tags"
    category = "categories"

[markup]
    [markup.highlight]
        codeFences = true
        lineNos = true
        style = "solarized-light"
        # emit CSS classes instead of inline styles so a dark-mode stylesheet
        # (static/css/syntax-dark.css) can override colours per data-theme
        noClasses = false
    [markup.goldmark.renderer]
        # so html tags inside markdown can be rendered
        unsafe = true

