<div class="section">
    <h2 class="h2">Extracurriculars</h2>
    {{ range . }}
    <div class="extracurriculars subsection">
        <h3 class="h3 title">{{ .title }}</h3>
        {{ with .time }}<h3 class="h3 time">{{ . }}</h3>{{ end }}
        {{ if .description }}
        <div class="details"><ul>
            {{ range .description }}<li>{{ . }}</li>{{ end }}
        </ul></div>
        {{ end }}
        {{ with .details }}<div class="details">{{ . }}</div>{{ end }}
        {{ if .links }}
        <div class="links">
            <div class="subheading">Link(s): </div>
            {{ range .links }}<div class="link"><a href="{{ .url }}">{{ .title }}</a></div>{{ end }}
        </div>
        {{ end }}
    </div>
    {{ end }}
</div>
