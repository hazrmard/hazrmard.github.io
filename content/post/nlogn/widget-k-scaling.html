<div class="nlogn-widget" data-nlogn-widget="k-scaling">
    <div class="nw-card">
        <div class="nw-header">
            <div>
                <h4 class="nw-title">Constant <em>k</em> vs. <em>n</em>-Dependent <em>k</em></h4>
                <p class="nw-subtitle">Any fixed branching factor <em>k</em> stays locked to binary sorting by a constant ratio; letting <em>k</em> grow with <em>n</em> breaks away into linear <em>O</em>(<em>n</em>).</p>
            </div>
        </div>

        <div class="nw-controls">
            <div class="nw-segmented" role="group" aria-label="Chart y-axis metric">
                <button type="button" class="nw-seg-btn is-active" data-metric="per-item">Steps per item (log<sub>k</sub> n)</button>
                <button type="button" class="nw-seg-btn" data-metric="total">Total steps (linear axes)</button>
            </div>
            <div class="nw-slider-wrap">
                <label for="nw-kscale-slider">Inspect <em>n</em>:</label>
                <input id="nw-kscale-slider" type="range" min="0" max="100" step="1" value="60" data-role="exp-slider" aria-label="Input size n from 10 to 1,000,000">
                <span class="nw-slider-val" data-role="n-readout" style="min-width: 72px;">10,000</span>
            </div>
        </div>

        <div class="nw-stage">
            <svg viewBox="0 0 680 310" role="img" aria-label="Scaling comparison chart showing constant branching factor k staying proportional to binary log2 n while n-dependent k flattens to linear O(n)"></svg>
        </div>

        <div class="nw-kscale-legend" data-role="legend"></div>
    </div>
</div>
