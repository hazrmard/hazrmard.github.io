<div id="hugo-entropy-widget" style="margin: 2rem 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
    <style>
        #hugo-entropy-widget .widget-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }
        {{/*  @media (min-width: 900px) {
            #hugo-entropy-widget .widget-grid { grid-template-columns: 350px 1fr; }
        }  */}}
        #hugo-entropy-widget .widget-card {
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }
        #hugo-entropy-widget .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 20px;
            border-bottom: 1px solid #e5e7eb;
            padding-bottom: 15px;
        }
        #hugo-entropy-widget #entropy-plot-container {
            width: 100%;
            height: 500px;
        }
        #hugo-entropy-widget .canvas-container {
            position: relative;
            background: #f9fafb;
            border: 2px dashed #d1d5db;
            border-radius: 8px;
            cursor: crosshair;
            margin: 10px 0;
            height: 180px;
        }
        #hugo-entropy-widget canvas { width: 100%; height: 100%; touch-action: none; }
        #hugo-entropy-widget .legend-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        #hugo-entropy-widget .legend-item {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.75rem;
        }
        #hugo-entropy-widget .dot { height: 10px; width: 10px; border-radius: 50%; display: inline-block; }
        #hugo-entropy-widget .control-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            margin-bottom: 5px;
            font-weight: 600;
        }
        #hugo-entropy-widget input[type=range] { width: 100%; margin-bottom: 15px; }
        #hugo-entropy-widget .stats-badge {
            background: #f3f4f6;
            padding: 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            text-align: center;
            border: 1px solid #e5e7eb;
        }
    </style>

    <div class="widget-grid">
        <div class="widget-card">
            <h3 style="margin: 0 0 10px 0; font-size: 1.1rem;">Distribution Designer</h3>
            
            <label class="control-label">
                Categories (k) <span id="k-val">50</span>
            </label>
            <input type="range" id="k-slider" min="2" max="100" value="50">

            <div class="control-label">Draw PDF Shape</div>
            <div class="canvas-container">
                <canvas id="dist-canvas"></canvas>
            </div>
            
            <div class="stats-badge">
                <div><strong>Custom Entropy ($N=k$)</strong></div>
                <div style="font-size: 1.4rem; color: #9c27b0; margin: 5px 0;"><span id="current-h">0.00</span> <small style="font-size: 0.7rem; color: #6b7280;">bits</small></div>
            </div>
            
            <button id="clear-btn" style="width: 100%; margin-top: 15px; padding: 10px; cursor: pointer; border: 1px solid #d1d5db; border-radius: 6px; background: white; font-weight: 500;">Reset Drawing</button>
        </div>

        <div class="widget-card">
            <div class="header">
                <div>
                    <h3 style="margin: 0;">Multi-Surface Analysis</h3>
                    <p style="margin: 5px 0 0 0; color: #6b7280; font-size: 0.85rem;">Comparing four distinct entropy profiles</p>
                </div>
                <div class="legend-grid">
                    <div class="legend-item"><span class="dot" style="background: #1f77b4;"></span> Equal</div>
                    <div class="legend-item"><span class="dot" style="background: #ff7f0e;"></span> Random</div>
                    <div class="legend-item"><span class="dot" style="background: #d62728;"></span> Skewed</div>
                    <div class="legend-item"><span class="dot" style="background: #9c27b0;"></span> Custom</div>
                </div>
            </div>
            <div id="entropy-plot-container"></div>
        </div>
    </div>

    <script src="https://cdn.plot.ly/plotly-2.24.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
    
    <script>
    (function() {
        const canvas = document.getElementById('dist-canvas');
        const ctx = canvas.getContext('2d');
        const kSlider = document.getElementById('k-slider');
        const kValDisplay = document.getElementById('k-val');
        const hDisplay = document.getElementById('current-h');
        const plotContainer = document.getElementById('entropy-plot-container');
        
        let isDrawing = false;
        let points = new Array(200).fill(0.3); 
        
        const COLORS = {
            equal: '#1f77b4',
            random: '#ff7f0e',
            skewed: '#d62728',
            custom: '#9c27b0'
        };

        function resizeCanvas() {
            const rect = canvas.parentElement.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
            drawDesigner();
        }

        function getMousePos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: Math.max(0, Math.min(1, (clientX - rect.left) / rect.width)),
                y: Math.max(0, Math.min(1, 1 - (clientY - rect.top) / rect.height))
            };
        }

        function handleMove(e) {
            if (!isDrawing) return;
            const pos = getMousePos(e);
            const idx = Math.floor(pos.x * (points.length - 1));
            points[idx] = pos.y;
            for(let i = 1; i < 5; i++) {
                if(idx - i >= 0) points[idx-i] = (points[idx-i] + pos.y * (1 - i/5)) / (2 - i/5);
                if(idx + i < points.length) points[idx+i] = (points[idx+i] + pos.y * (1 - i/5)) / (2 - i/5);
            }
            drawDesigner();
            updatePlot();
        }

        function getDiscretizedProbs(k) {
            let weights = [];
            for (let i = 0; i < k; i++) {
                const sampleIdx = Math.floor(((i + 0.5) / k) * (points.length - 1));
                weights.push(Math.max(0.0001, points[sampleIdx]));
            }
            const sum = weights.reduce((a, b) => a + b, 0);
            return weights.map(w => w / sum);
        }

        function drawDesigner() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            const k = parseInt(kSlider.value);
            const binWidth = canvas.width / k;
            const probs = getDiscretizedProbs(k);
            const maxP = Math.max(...probs);

            // Draw bins (the discretized version)
            ctx.fillStyle = 'rgba(156, 39, 176, 0.15)';
            probs.forEach((p, i) => {
                const h = (p / maxP) * (canvas.height * 0.8);
                ctx.fillRect(i * binWidth, canvas.height, binWidth, -h);
                ctx.strokeStyle = 'rgba(156, 39, 176, 0.3)';
                ctx.strokeRect(i * binWidth, canvas.height, binWidth, -h);
            });

            // Draw the continuous line
            ctx.beginPath();
            ctx.strokeStyle = COLORS.custom;
            ctx.lineWidth = 3;
            points.forEach((y, i) => {
                const x = (i / (points.length - 1)) * canvas.width;
                const canvasY = (1 - y) * canvas.height;
                if (i === 0) ctx.moveTo(x, canvasY);
                else ctx.lineTo(x, canvasY);
            });
            ctx.stroke();
        }

        function calculateEntropy(probs) {
            return -probs.reduce((acc, p) => p > 0 ? acc + (p * Math.log2(p)) : acc, 0);
        }

        function updatePlot() {
            const kActive = parseInt(kSlider.value);
            kValDisplay.textContent = kActive;
            const customH = calculateEntropy(getDiscretizedProbs(kActive));
            hDisplay.textContent = customH.toFixed(2);

            const res = 15; 
            const steps = d3.range(1, res + 1).map(d => d * (100/res));

            const surfaces = ['equal', 'random', 'skewed', 'custom'].map(type => {
                let z = [];
                steps.forEach(k => {
                    let row = [];
                    let kInt = Math.floor(k);
                    let h;
                    
                    if (type === 'equal') h = Math.log2(kInt);
                    else if (type === 'skewed') h = 0; // p1=1, others=0
                    else if (type === 'custom') h = calculateEntropy(getDiscretizedProbs(kInt));
                    else if (type === 'random') {
                        let r = Array.from({length: kInt}, () => Math.random());
                        let s = r.reduce((a,b)=>a+b,0);
                        h = calculateEntropy(r.map(v=>v/s));
                    }
                    
                    steps.forEach(N => row.push(k > N ? null : h));
                    z.push(row);
                });

                return {
                    z: z, x: steps, y: steps,
                    type: 'surface',
                    showscale: false,
                    opacity: type === 'custom' ? 0.9 : 0.3,
                    name: type,
                    colorscale: [[0, COLORS[type]], [1, COLORS[type]]],
                    hoverinfo: 'z+name'
                };
            });

            Plotly.react(plotContainer, surfaces, {
                scene: {
                    xaxis: { title: 'N' }, yaxis: { title: 'k' }, zaxis: { title: 'H', range: [0, 7] },
                    camera: { eye: { x: 1.8, y: 1.8, z: 1.2 } },
                    aspectratio: { x: 1, y: 1, z: 0.7 }
                },
                margin: { l: 0, r: 0, b: 0, t: 0 },
                showlegend: false,
                paper_bgcolor: 'rgba(0,0,0,0)'
            }, {displayModeBar: false});
        }

        canvas.addEventListener('mousedown', () => isDrawing = true);
        window.addEventListener('mouseup', () => isDrawing = false);
        canvas.addEventListener('mousemove', handleMove);
        canvas.addEventListener('touchstart', (e) => { e.preventDefault(); isDrawing = true; handleMove(e); });
        canvas.addEventListener('touchmove', (e) => { e.preventDefault(); handleMove(e); });
        canvas.addEventListener('touchend', () => isDrawing = false);
        kSlider.addEventListener('input', () => { drawDesigner(); updatePlot(); });
        document.getElementById('clear-btn').addEventListener('click', () => { points.fill(0.3); drawDesigner(); updatePlot(); });

        window.addEventListener('resize', () => { resizeCanvas(); Plotly.Plots.resize(plotContainer); });
        setTimeout(() => { resizeCanvas(); updatePlot(); }, 100);
    })();
    </script>
</div>
